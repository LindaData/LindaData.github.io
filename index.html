<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="refresh" content="0; url=./hq/">
  <title>LindaData HQ</title>
  <meta name="description" content="LindaData HQ command center entry point.">
  <style>
    :root{color-scheme:dark;--bg:#07111f;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--ink:#f8fbff;--muted:#aebed3;--brand:#7dd3fc;--good:#34d399;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:22px;color:var(--ink);background:radial-gradient(circle at 18% 0,rgba(125,211,252,.25),transparent 28rem),linear-gradient(180deg,#07111f,#0d1728)}main{width:min(680px,100%);border:1px solid var(--line);border-radius:28px;background:var(--card);box-shadow:0 24px 80px rgba(0,0,0,.35);padding:28px}p{color:var(--muted);line-height:1.55}.eyebrow{margin:0 0 8px;color:var(--brand);font-size:.75rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase}h1{margin:0;font-size:clamp(2.4rem,12vw,5rem);line-height:.92;letter-spacing:-.07em}.actions{display:grid;gap:10px;margin-top:18px}.button{min-height:50px;border-radius:999px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:950;color:#06111f;background:linear-gradient(135deg,var(--brand),var(--good))}.ghost{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line)}.note{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:18px;background:rgba(0,0,0,.16)}@media(min-width:680px){.actions{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">LindaData</p>
    <h1>Opening HQ.</h1>
    <p>Root traffic now goes to the LindaData HQ command center.</p>
    <div class="actions">
      <a class="button" href="./hq/">Open HQ</a>
      <a class="button ghost" href="https://github.com/LindaData/field-copilot-pro/issues/61">Open HQ inbox</a>
    </div>
    <div class="note">
      <strong>Security note</strong>
      <p>Public GitHub Pages files are public. Private HQ data needs a real auth layer before sensitive details should be shown here.</p>
    </div>
  </main>
  <script>location.replace("./hq/");</script>
</body>
</html>
