<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LindaData Mobile HQ</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#172b4d;--muted:#5e6c84;--line:#dfe1e6;--blue:#0052cc;--green:#00875a;--red:#de350b;--yellow:#ffab00;--purple:#6554c0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);padding-bottom:92px}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:max(.55rem,env(safe-area-inset-top)) .75rem .55rem}.brand{display:flex;align-items:center;justify-content:space-between;gap:.75rem}.logo{display:flex;align-items:center;gap:.55rem;font-weight:900}.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0747a6,#0052cc);color:white;display:grid;place-items:center;font-size:.78rem}.sync{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:.32rem .55rem;color:var(--muted)}main{padding:.85rem;width:min(760px,100%);margin:auto}.hero{display:grid;gap:.6rem;margin:.35rem 0 1rem}h1,h2,h3,p{margin:0}h1{font-size:2.15rem;line-height:.96;letter-spacing:-.05em}h2{font-size:1.2rem}h3{font-size:.96rem}p{color:var(--muted);line-height:1.45}.actions,.tabs,.chips{display:flex;gap:.45rem;overflow:auto;padding:.15rem 0}.btn,.tab,.chip{min-height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:.55rem .7rem;font-weight:800;font-size:.86rem;white-space:nowrap}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.tab.active,.chip.active{background:#deebff;color:#0747a6;border-color:#b3d4ff}.search{width:100%;min-height:44px;border:1px solid #c1c7d0;border-radius:12px;background:#fff;padding:0 .8rem;outline:none}.lane{margin:.75rem 0;background:#ebecf0;border:1px solid #dfe1e6;border-radius:14px;padding:.6rem}.lane-head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.2rem}.lane-title{font-weight:900;text-transform:uppercase;font-size:.78rem;letter-spacing:.08em;color:#42526e}.count{min-width:26px;height:26px;border-radius:99px;background:#dfe1e6;display:grid;place-items:center;font-size:.78rem;font-weight:900}.cards{display:grid;gap:.55rem;margin-top:.45rem}.card{background:#fff;border:1px solid #dfe1e6;border-radius:12px;padding:.75rem;box-shadow:0 1px 2px rgba(9,30,66,.12);display:grid;gap:.55rem}.card-top{display:flex;align-items:start;justify-content:space-between;gap:.5rem}.key{font-size:.72rem;color:#7a869a;font-weight:900}.title{font-weight:850;font-size:1rem;color:#172b4d}.desc{font-size:.86rem}.pill{display:inline-flex;border:1px solid #dfe1e6;border-radius:6px;background:#f4f5f7;padding:.25rem .42rem;font-size:.72rem;font-weight:800;color:#42526e}.hot{background:#ffebe6!important;border-color:#ffbdad!important;color:#bf2600!important}.high{background:#fff0b3!important;border-color:#ffe380!important;color:#7f4f01!important}.live{background:#e3fcef!important;border-color:#abf5d1!important;color:#006644!important}.hold{background:#eae6ff!important;border-color:#c0b6f2!important;color:#403294!important}.meta{display:flex;gap:.35rem;flex-wrap:wrap}.card-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem;border-top:1px solid #dfe1e6;padding-top:.55rem}.card-actions button,.card-actions a{min-height:36px;border:1px solid #dfe1e6;border-radius:8px;background:#fff;color:#0747a6;font-weight:850;font-size:.78rem;display:grid;place-items:center;text-align:center}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:.85rem;margin:.75rem 0}.form{display:grid;gap:.7rem}.grid{display:grid;gap:.55rem}label{display:grid;gap:.25rem;color:#42526e;font-weight:850;font-size:.82rem}input,select,textarea{width:100%;border:1px solid #c1c7d0;border-radius:10px;padding:.7rem;background:#fff}textarea{min-height:96px}.drawer{position:fixed;inset:auto 0 0 0;z-index:50;background:#fff;border-radius:20px 20px 0 0;max-height:92svh;transform:translateY(110%);transition:.2s;box-shadow:0 -14px 44px rgba(9,30,66,.22);display:grid;grid-template-rows:auto 1fr}.drawer.open{transform:translateY(0)}.drawer-head{padding:.9rem;border-bottom:1px solid var(--line);display:flex;align-items:start;justify-content:space-between;gap:.75rem}.drawer-body{overflow:auto;padding:.9rem;display:grid;gap:.8rem}.x{border:0;background:#ebecf0;border-radius:10px;width:38px;height:38px;font-weight:900}.bottom{position:fixed;left:.55rem;right:.55rem;bottom:max(.55rem,env(safe-area-inset-bottom));z-index:30;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;padding:.35rem;display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem;backdrop-filter:blur(16px)}.bottom button{border:0;background:transparent;border-radius:13px;min-height:42px;font-weight:850;font-size:.75rem;color:#5e6c84}.bottom button.active{background:#deebff;color:#0747a6}.toast{position:fixed;left:.75rem;right:.75rem;bottom:calc(68px + env(safe-area-inset-bottom));z-index:70;background:#172b4d;color:white;border-radius:12px;padding:.75rem;transform:translateY(140%);transition:.18s}.toast.show{transform:translateY(0)}.empty{border:1px dashed #c1c7d0;border-radius:12px;padding:.8rem;color:#7a869a;background:#fff}.hide{display:none!important}@media(min-width:760px){.drawer{left:auto;width:520px;max-height:100svh;border-radius:0;transform:translateX(110%)}.drawer.open{transform:translateX(0)}.card-actions{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo"><span class="mark">LD</span><span>Mobile HQ</span></div><span class="sync" id="sync">checking</span></div></header>
<main>
<section class="hero"><h1>Better than Jira starts here.</h1><p>Mobile-first LindaData work board. Cards, issues, comments, checklist, reports, automations, local save, export, and GitHub inbox sync.</p><div class="actions"><button class="btn primary" id="newTop">Create</button><a class="btn" href="https://lindadata.github.io/field-copilot-pro/app/today/">HVAC</a><a class="btn" href="/company/Review_Layer_Standard.md">Review standard</a></div></section>
<input class="search" id="search" placeholder="Search work…">
<div class="chips"><button class="chip active" data-filter="all">All</button><button class="chip" data-filter="active">Active</button><button class="chip" data-filter="blocker">Blockers</button><button class="chip" data-filter="review">Review</button><button class="chip" data-filter="dirty">Unsynced</button></div>
<section id="view"></section>
</main>
<nav class="bottom"><button class="active" data-view="board">Board</button><button data-view="backlog">Backlog</button><button data-view="reports">Reports</button><button data-view="settings">Set</button><button id="newBottom">New</button></nav>
<aside class="drawer" id="drawer"><div class="drawer-head"><div><div class="key" id="dKey">Issue</div><h2 id="dTitle">Issue</h2></div><button class="x" id="close">×</button></div><div class="drawer-body" id="drawerBody"></div></aside>
<div class="toast" id="toast"></div>
<script>
(()=>{const registry='/hq/data/projects.json',endpoint='https://soft-unit-ba5d.sergio-mora.workers.dev/review-note';const LS='ld-mobile-hq-v1';const lanes=[['selected','Now'],['progress','Doing'],['review','Review'],['backlog','Backlog'],['done','Done']];let S={view:'board',filter:'all',q:'',issues:[],docs:[],settings:{autoBlocker:true,autoReview:true}};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function t(m){const n=$('toast');n.textContent=m;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2400)}function save(){localStorage.setItem(LS,JSON.stringify(S))}function load(){try{const x=JSON.parse(localStorage.getItem(LS)||'null');if(x?.issues)S={...S,...x}}catch{}}function tone(v){v=String(v||'').toLowerCase();if(v.includes('blocker')||v.includes('hot')||v.includes('priority 1'))return'hot';if(v.includes('review')||v.includes('high')||v.includes('medium'))return'high';if(v.includes('done')||v.includes('live'))return'live';if(v.includes('hold')||v.includes('private')||v.includes('pause'))return'hold';return''}function lane(p){const h=[p.title,p.status,p.priority,p.visibility,p.summary,p.category].join(' ').toLowerCase();if(p.key==='hvac-copilot'||h.includes('priority 1')||h.includes('hot'))return'selected';if(h.includes('closed')||h.includes('legacy')||h.includes('reference'))return'done';if(h.includes('hold')||h.includes('paused')||h.includes('private-needed'))return'backlog';if(h.includes('review')||h.includes('preview'))return'review';return'progress'}function fromProject(p,i){return{id:`LD-${i+1}`,sourceKey:p.key,title:p.title,description:p.summary||'',status:lane(p),priority:(p.priority||'medium').toLowerCase().includes('hot')?'blocker':(p.priority||'medium').toLowerCase(),type:'Task',assignee:(p.owners||[])[0]||'Chief of Staff',owners:p.owners||[],labels:[p.category,p.visibility].filter(Boolean),points:(p.priority||'').toLowerCase().includes('hot')?8:3,sprint:['selected','progress','review'].includes(lane(p))?'Sprint 1':'Backlog',epic:p.category||'LindaData',due:new Date(Date.now()+(i+3)*86400000).toISOString().slice(0,10),links:p.links||[],comments:[],subtasks:[],activity:['Loaded from registry'],dirty:false}}async function init(){load();try{const r=await fetch(registry,{cache:'no-store'});const d=await r.json();S.docs=d.companyDocs||[];const keys=new Set(S.issues.map(x=>x.sourceKey));(d.projects||[]).forEach(p=>{if(!keys.has(p.key))S.issues.push(fromProject(p,S.issues.length))});save()}catch(e){t('Registry failed')}render();fetch(endpoint.replace('/review-note','/health')).then(r=>r.ok?r.json():Promise.reject()).then(()=>{$('sync').textContent='sync live';$('sync').className='sync live'}).catch(()=>{$('sync').textContent='sync fail';$('sync').className='sync hot'})}function hay(x){return[x.id,x.title,x.description,x.status,x.priority,x.assignee,x.sprint,x.epic,...(x.labels||[])].join(' ').toLowerCase()}function match(x){if(S.q&&!hay(x).includes(S.q))return false;if(S.filter==='all')return true;if(S.filter==='active')return!['backlog','done'].includes(x.status);if(S.filter==='blocker')return x.priority==='blocker';if(S.filter==='review')return x.status==='review'||hay(x).includes('review');if(S.filter==='dirty')return x.dirty;return true}function card(x){return`<article class="card"><div class="card-top"><span class="key">${x.id}</span><span class="pill ${tone(x.priority)}">${esc(x.priority)}</span></div><div class="title">${esc(x.title)}</div><p class="desc">${esc(x.description).slice(0,120)}</p><div class="meta"><span class="pill ${tone(x.status)}">${esc(x.status)}</span><span class="pill">${esc(x.points)} pts</span>${x.dirty?'<span class="pill high">unsynced</span>':''}</div><p class="key">${esc(x.assignee)} · ${esc(x.sprint)}</p><div class="card-actions"><button data-open="${x.id}">Open</button><button data-move="${x.id}" data-dir="-1">←</button><button data-move="${x.id}" data-dir="1">→</button>${(x.links||[])[0]?`<a href="${esc(x.links[0].url)}">${esc(x.links[0].label)}</a>`:''}</div></article>`}function board(){const by=Object.fromEntries(lanes.map(l=>[l[0],[]]));S.issues.filter(match).forEach(x=>(by[x.status]||by.backlog).push(x));$('view').innerHTML=lanes.map(l=>`<section class="lane"><div class="lane-head"><span class="lane-title">${l[1]}</span><span class="count">${by[l[0]].length}</span></div><div class="cards">${by[l[0]].length?by[l[0]].map(card).join(''):'<div class="empty">No cards.</div>'}</div></section>`).join('');wire()}function backlog(){const rows=S.issues.filter(match);$('view').innerHTML=`<section class="panel"><h2>Backlog</h2><div class="cards">${rows.map(card).join('')}</div></section>`;wire()}function reports(){const total=S.issues.length,done=S.issues.filter(x=>x.status==='done').length,dirty=S.issues.filter(x=>x.dirty).length,pts=S.issues.reduce((a,x)=>a+(+x.points||0),0);$('view').innerHTML=`<section class="panel"><h2>Reports</h2><div class="grid"><div class="panel"><h1>${total}</h1><p>Issues</p></div><div class="panel"><h1>${done}</h1><p>Done</p></div><div class="panel"><h1>${pts}</h1><p>Points</p></div><div class="panel"><h1>${dirty}</h1><p>Unsynced</p></div></div></section>`}function settings(){$('view').innerHTML=`<section class="panel"><h2>Settings</h2><button class="btn primary" id="export">Export JSON</button> <button class="btn" id="syncDirty">Sync changed</button> <button class="btn" id="reset">Reset registry</button><p class="small">Mobile edits save locally. Sync changed sends durable notes to GitHub inbox.</p></section>`;$('export').onclick=exportJson;$('syncDirty').onclick=syncDirty;$('reset').onclick=()=>{localStorage.removeItem(LS);S.issues=[];init()}}function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===S.view));if(S.view==='board')board();if(S.view==='backlog')backlog();if(S.view==='reports')reports();if(S.view==='settings')settings()}function wire(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>open(b.dataset.open));document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(b.dataset.move,+b.dataset.dir))}function move(id,dir){const x=S.issues.find(i=>i.id===id);const idx=lanes.findIndex(l=>l[0]===x.status);x.status=lanes[Math.max(0,Math.min(lanes.length-1,idx+dir))][0];x.dirty=true;x.activity.push('Moved '+x.status);save();render()}function open(id){const fresh=!id;const x=fresh?{id:`LD-${S.issues.length+1}`,title:'',description:'',status:'backlog',priority:'medium',type:'Task',assignee:'Chief of Staff',labels:[],points:3,sprint:'Backlog',epic:'LindaData',due:'',links:[],comments:[],subtasks:[],activity:['Created'],dirty:true}:S.issues.find(i=>i.id===id);$('dKey').textContent=fresh?'New issue':x.id;$('dTitle').textContent=fresh?'Create issue':x.title;drawerBody.innerHTML=`<form id="f" class="form"><label>Title<input id="title" value="${esc(x.title)}"></label><label>Description<textarea id="desc">${esc(x.description)}</textarea></label><div class="grid"><label>Status<select id="status">${lanes.map(l=>`<option value="${l[0]}" ${x.status===l[0]?'selected':''}>${l[1]}</option>`)}</select></label><label>Priority<select id="priority">${['low','medium','high','blocker'].map(v=>`<option ${x.priority===v?'selected':''}>${v}</option>`)}</select></label><label>Assignee<input id="assignee" value="${esc(x.assignee)}"></label><label>Points<input id="points" type="number" value="${esc(x.points)}"></label><label>Sprint<input id="sprint" value="${esc(x.sprint)}"></label><label>Epic<input id="epic" value="${esc(x.epic)}"></label></div><button class="btn primary">Save</button><button type="button" class="btn" id="syncOne">Sync issue</button></form><section class="panel"><h3>Checklist</h3>${(x.subtasks||[]).map((s,i)=>`<label><input type="checkbox" data-sub="${i}" ${s.done?'checked':''}> ${esc(s.text)}</label>`).join('')||'<p class="small">None yet.</p>'}<input id="sub" placeholder="Add checklist"><button class="btn" id="addSub">Add</button></section><section class="panel"><h3>Comments</h3>${(x.comments||[]).map(c=>`<p>${esc(c.text)}</p>`).join('')||'<p class="small">No comments.</p>'}<textarea id="comment" placeholder="Add comment"></textarea><button class="btn" id="addComment">Add comment</button></section>`;drawer.classList.add('open');f.onsubmit=e=>{e.preventDefault();x.title=title.value||'Untitled';x.description=desc.value;x.status=status.value;x.priority=priority.value;x.assignee=assignee.value;x.points=+points.value||0;x.sprint=sprint.value;x.epic=epic.value;x.dirty=true;if(fresh)S.issues.push(x);save();render();open(x.id);t('Saved locally')};syncOne.onclick=()=>sync(x);addSub.onclick=()=>{if(sub.value.trim()){x.subtasks.push({text:sub.value.trim(),done:false});x.dirty=true;save();open(x.id)}};addComment.onclick=()=>{if(comment.value.trim()){x.comments.push({text:comment.value.trim(),at:new Date().toISOString()});x.dirty=true;save();open(x.id)}};document.querySelectorAll('[data-sub]').forEach(c=>c.onchange=()=>{x.subtasks[+c.dataset.sub].done=c.checked;x.dirty=true;save()})}async function sync(x){try{const res=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({event:'review_note',repo:'LindaData/field-copilot-pro',sourceRepo:'LindaData/LindaData.github.io',inboxIssue:'61',sessionId:'mobile-hq',pageLabel:'LindaData Mobile HQ',routePath:location.pathname,url:location.href,userAgent:navigator.userAgent,viewport:{width:innerWidth,height:innerHeight},createdAt:new Date().toISOString(),note:{note:`${x.id} ${x.title}\nStatus: ${x.status}\nPriority: ${x.priority}\nAssignee: ${x.assignee}\n\n${x.description}`,kind:'mobile-hq-issue',priority:x.priority,pageLabel:`Mobile HQ / ${x.id}`,path:location.pathname,contextSummary:'Mobile-first better-than-Jira HQ',createdAt:new Date().toISOString(),viewport:{width:innerWidth,height:innerHeight}}})});const j=await res.json().catch(()=>({}));if(!res.ok||!j.ok)throw Error(j.error||'sync failed');x.dirty=false;x.syncedAt=new Date().toISOString();save();render();t('Synced to GitHub')}catch(e){t('Sync failed')}}async function syncDirty(){for(const x of S.issues.filter(i=>i.dirty))await sync(x)}function exportJson(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='lindadata-mobile-hq.json';a.click();URL.revokeObjectURL(a.href)}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;save();render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.filter=b.dataset.filter;render()});search.oninput=e=>{S.q=e.target.value.toLowerCase();render()};newTop.onclick=()=>open();newBottom.onclick=()=>open();close.onclick=()=>drawer.classList.remove('open');init()})();
</script>
</body>
</html>
