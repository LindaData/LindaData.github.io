<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
  <meta http-equiv='refresh' content='0; url=../'>
  <title>LindaData HQ</title>
  <meta name='description' content='Redirects to the LindaData HQ root command center.'>
  <style>
    :root{color-scheme:dark;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--ink:#f8fafc;--muted:#b7c3d7;--line:rgba(148,163,184,.2);--cyan:#67e8f9;--green:#34d399}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:22px;color:var(--ink);background:radial-gradient(circle at 8% 0,rgba(96,165,250,.32),transparent 32rem),linear-gradient(140deg,#050816,#0b1120 52%,#111827)}main{width:min(620px,100%);padding:24px;border:1px solid var(--line);border-radius:28px;background:rgba(15,23,42,.72);box-shadow:0 28px 90px rgba(0,0,0,.42)}p{color:var(--muted);line-height:1.55}.button{min-height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:950;color:#06111f;background:linear-gradient(135deg,var(--cyan),var(--green))}
  </style>
</head>
<body>
  <main>
    <h1>Opening LindaData HQ</h1>
    <p>The HQ now lives at the root page.</p>
    <a class='button' href='../'>Open HQ</a>
  </main>
  <script>location.replace('../');</script>
</body>
</html>
