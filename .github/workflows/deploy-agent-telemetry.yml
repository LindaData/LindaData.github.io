name: Deploy Agent Telemetry Worker

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - company/agent-workload/telemetry/**
      - .github/workflows/deploy-agent-telemetry.yml

jobs:
  deploy:
    name: Deploy private telemetry worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: company/agent-workload/telemetry
    env:
      TELEMETRY_URL: https://lindadata-agent-telemetry.sergio-mora.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Verify source files
        run: |
          test -f worker.js
          test -f wrangler.example.toml
          test -f sample-event.json

      - name: Validate GitHub writer token before deploy
        env:
          AGENT_TELEMETRY_GITHUB_TOKEN: ${{ secrets.AGENT_TELEMETRY_GITHUB_TOKEN }}
        run: |
          set +e
          HTTP_STATUS=$(curl -sS -o github-token-check.json -w "%{http_code}" \
            -H "accept: application/vnd.github+json" \
            -H "authorization: Bearer $AGENT_TELEMETRY_GITHUB_TOKEN" \
            -H "x-github-api-version: 2022-11-28" \
            "https://api.github.com/repos/LindaData/LindaData.github.io/contents/company/agent-workload/usage-log.json?ref=master")
          CURL_EXIT=$?
          set -e
          echo "github_token_curl_exit=$CURL_EXIT"
          echo "github_token_http_status=$HTTP_STATUS"
          cat github-token-check.json
          if [ "$CURL_EXIT" != "0" ]; then exit 1; fi
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "AGENT_TELEMETRY_GITHUB_TOKEN is not authorized for LindaData/LindaData.github.io contents read/write. Regenerate the fine-grained token, update the GitHub Actions secret, then rerun."
            exit 1
          fi

      - name: Prepare config
        run: cp wrangler.example.toml wrangler.toml

      - name: Deploy Worker source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.toml

      - name: Set Worker telemetry write credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEMETRY_WRITE_TOKEN: ${{ secrets.TELEMETRY_WRITE_TOKEN }}
        run: printf "%s" "$TELEMETRY_WRITE_TOKEN" | wrangler secret put TELEMETRY_WRITE_TOKEN --config wrangler.toml

      - name: Set Worker GitHub writer credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGENT_TELEMETRY_GITHUB_TOKEN: ${{ secrets.AGENT_TELEMETRY_GITHUB_TOKEN }}
        run: printf "%s" "$AGENT_TELEMETRY_GITHUB_TOKEN" | wrangler secret put GITHUB_TOKEN --config wrangler.toml

      - name: Wait for Worker secret propagation
        run: sleep 25

      - name: Verify health endpoint
        run: |
          curl -fsS "$TELEMETRY_URL/health" | tee health.json
          grep '"ok":true' health.json

      - name: Build smoke usage event
        run: |
          EVENT_ID="deploy-smoke-${GITHUB_RUN_ID}"
          cat > event.json <<EOF
          {
            "id": "$EVENT_ID",
            "date": "$(date +%F)",
            "executive_owner": "CIO + CSO + CTO",
            "agent": "Telemetry Deploy Smoke Test Agent",
            "task": "Verify deploy workflow can write private telemetry usage to usage-log.json",
            "minutes_estimate": 1,
            "usage": {
              "input_tokens": 100,
              "output_tokens": 50,
              "total_tokens": 150
            },
            "proof": "https://github.com/LindaData/LindaData.github.io/actions/runs/${GITHUB_RUN_ID}",
            "status": "done",
            "telemetry_source": "api"
          }
          EOF
          echo "EVENT_ID=$EVENT_ID" >> "$GITHUB_ENV"
          cat event.json

      - name: Send smoke usage event with retries
        env:
          TELEMETRY_WRITE_TOKEN: ${{ secrets.TELEMETRY_WRITE_TOKEN }}
        run: |
          PASS=0
          for i in 1 2 3 4 5 6; do
            echo "attempt=$i"
            set +e
            HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" -X POST "$TELEMETRY_URL/v1/agent-usage" \
              -H "content-type: application/json" \
              -H "authorization: Bearer $TELEMETRY_WRITE_TOKEN" \
              --data @event.json)
            CURL_EXIT=$?
            set -e
            echo "curl_exit=$CURL_EXIT"
            echo "http_status=$HTTP_STATUS"
            cat response.json
            if [ "$CURL_EXIT" = "0" ] && [ "$HTTP_STATUS" = "200" ] && grep -q '"ok":true' response.json; then
              PASS=1
              break
            fi
            sleep 10
          done
          test "$PASS" = "1"

      - name: Verify usage ledger updated
        run: |
          sleep 8
          curl -fsS "https://raw.githubusercontent.com/LindaData/LindaData.github.io/master/company/agent-workload/usage-log.json" | tee usage-log.json
          grep "$EVENT_ID" usage-log.json

      - name: Done
        run: echo "Worker deployed, health passed, usage write passed, ledger verification passed."
